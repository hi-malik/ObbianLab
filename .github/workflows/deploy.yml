name: deploy
on:
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], required: true }
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }
  publish:
    needs: checks
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, context: . }
          - { name: web, file: apps/web/Dockerfile, context: . }
          - { name: pipeline, file: services/pipeline/Dockerfile, context: . }
          - { name: ai, file: services/ai/Dockerfile, context: services/ai }
          - { name: allocation, file: services/allocation/Dockerfile, context: services/allocation }
          - { name: migrations, file: db/Dockerfile.migrations, context: db }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: registry
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.registry.outputs.registry }}/${{ vars.ECR_PREFIX }}/${{ matrix.name }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.registry.outputs.registry }}/${{ vars.ECR_PREFIX }}/${{ matrix.name }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Publish scanned image and record digest
        env:
          IMAGE: ${{ steps.registry.outputs.registry }}/${{ vars.ECR_PREFIX }}/${{ matrix.name }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          SERVICE: ${{ matrix.name }}
        run: |
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" > "$SERVICE.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: '*.digest'
          overwrite: true
  deploy:
    needs: publish
    environment: ${{ inputs.environment }}
    # Runner is inside the VPC or has a stable egress CIDR allowed by EKS.
    runs-on: [self-hosted, linux, x64, obbian-deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'digest-*', merge-multiple: true, path: digests }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install PyYAML
      - name: Migrate, deploy, verify and restore prior workload configuration on failure
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          APPLICATION_SECRET_ARN: ${{ secrets.APPLICATION_SECRET_ARN }}
          VPC_CIDR: ${{ vars.VPC_CIDR }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          python3 -c 'import json,pathlib; pathlib.Path("images.json").write_text(json.dumps({p.stem:p.read_text().strip() for p in pathlib.Path("digests").glob("*.digest")}))'
          python3 scripts/deploy.py --images images.json --release "${{ github.sha }}" --region "$AWS_REGION" --hostname "$PUBLIC_HOSTNAME" --certificate-arn "$CERTIFICATE_ARN" --secret-id "$APPLICATION_SECRET_ARN" --vpc-cidr "${VPC_CIDR:-10.42.0.0/16}"
